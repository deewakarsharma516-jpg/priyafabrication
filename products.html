<style>
/* ===== Priya Fabrication — Industrial theme ===== */
:root{
  --steel-900:#0C1420; --steel-800:#12203A; --steel-700:#173A63;
  --blue:#2E6FBF; --amber:#F5811E; --amber-glow:#FFA23E;
  --grey:#8DA0B6; --line:#d7e0ea; --paper:#EEF3F8; --white:#fff;
  --ink:#12203A; --muted:#5a6b80;
  --shadow:0 10px 30px rgba(12,20,32,.10);
  --radius:14px;
  --wrap:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:'Inter','Segoe UI',system-ui,sans-serif;
  color:var(--ink); background:var(--white); line-height:1.6;
}
h1,h2,h3,h4,.display{font-family:'Oswald','Arial Narrow',sans-serif; font-weight:700; line-height:1.08; letter-spacing:.3px; margin:0}
a{color:inherit; text-decoration:none}
img{max-width:100%; display:block}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 22px}
.eyebrow{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:3px; font-size:13px; color:var(--amber); font-weight:600}
.section{padding:76px 0}
.section.alt{background:var(--paper)}
.center{text-align:center}
.btn{display:inline-flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1.5px; font-size:14px; font-weight:600; padding:13px 24px; border-radius:8px; cursor:pointer; border:0; transition:.18s; white-space:nowrap}
.btn-amber{background:linear-gradient(135deg,var(--amber-glow),var(--amber)); color:#241200; box-shadow:0 8px 20px rgba(245,129,30,.35)}
.btn-amber:hover{transform:translateY(-2px)}
.btn-steel{background:var(--steel-700); color:#fff}
.btn-steel:hover{background:var(--steel-800)}
.btn-ghost{background:transparent; color:#fff; border:2px solid rgba(255,255,255,.5)}
.btn-ghost:hover{border-color:var(--amber); color:var(--amber-glow)}
.btn-outline{background:#fff; color:var(--steel-700); border:2px solid var(--line)}
.btn-outline:hover{border-color:var(--blue); color:var(--blue)}

/* ===== Top bar ===== */
.topbar{background:var(--steel-900); color:#cdd8e6; font-size:13px}
.topbar .wrap{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:8px 22px; flex-wrap:wrap}
.topbar a{color:#cdd8e6} .topbar a:hover{color:var(--amber-glow)}
.topbar .t-links{display:flex; gap:20px; flex-wrap:wrap}
.topbar b{color:#fff}

/* ===== Header / nav ===== */
header.site{position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 2px 14px rgba(12,20,32,.05)}
header.site .wrap{display:flex; align-items:center; justify-content:space-between; gap:18px; padding:12px 22px}
.brand img{height:56px}
nav.main{display:flex; gap:8px; align-items:center}
nav.main a{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:15px; font-weight:600; color:var(--steel-800); padding:8px 14px; border-radius:8px; position:relative}
nav.main a:hover{color:var(--amber); background:var(--paper)}
nav.main a.active{color:var(--amber)}
nav.main a.active::after{content:""; position:absolute; left:14px; right:14px; bottom:2px; height:3px; background:var(--amber); border-radius:2px}
.nav-cta{display:flex; gap:10px; align-items:center}
.burger{display:none; background:none; border:0; cursor:pointer; padding:6px}
.burger span{display:block; width:26px; height:3px; background:var(--steel-800); margin:5px 0; border-radius:2px}

/* ===== Hero ===== */
.hero{position:relative; background:radial-gradient(1200px 500px at 80% -10%,rgba(46,111,191,.35),transparent),linear-gradient(160deg,var(--steel-900),var(--steel-800) 60%,var(--steel-700)); color:#fff; overflow:hidden}
.hero::before{content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px); background-size:44px 44px; opacity:.5}
.hero .wrap{position:relative; padding:70px 22px 40px}
.hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center}
.hero h1{font-size:clamp(38px,5vw,62px); text-transform:uppercase}
.hero h1 span{color:var(--amber-glow)}
.hero p.lead{font-size:18px; color:#c7d3e2; max-width:540px; margin:18px 0 26px}
.hero-actions{display:flex; gap:14px; flex-wrap:wrap}
.hero-stats{display:flex; gap:30px; margin-top:34px; flex-wrap:wrap}
.hero-stats .n{font-family:'Oswald',sans-serif; font-size:34px; color:#fff; font-weight:700}
.hero-stats .l{font-size:12.5px; color:var(--grey); text-transform:uppercase; letter-spacing:1.5px}
.hero-badge{display:inline-flex; align-items:center; gap:9px; background:rgba(245,129,30,.14); border:1px solid rgba(245,129,30,.4); color:var(--amber-glow); padding:7px 15px; border-radius:30px; font-size:13px; font-weight:600; letter-spacing:.5px; margin-bottom:20px}
.hero-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--amber-glow);box-shadow:0 0 10px var(--amber-glow)}

/* Hero visual panel */
.hero-visual{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:18px; backdrop-filter:blur(4px)}
.hv-title{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--grey); margin-bottom:12px}

/* ===== Conveyor (signature moving strip) ===== */
.conveyor{background:var(--steel-900); border-top:4px solid var(--amber); border-bottom:4px solid var(--amber); overflow:hidden; position:relative}
.conveyor::after{content:""; position:absolute; left:0; right:0; bottom:0; height:10px; background:repeating-linear-gradient(90deg,#0C1420 0 22px,#F5811E 22px 30px)}
.conv-label{position:absolute; top:10px; left:22px; z-index:3; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:2px; font-size:12px; color:var(--grey)}
.conveyor-track{display:flex; gap:16px; padding:44px 0 26px; width:max-content; animation:roll 46s linear infinite}
.conveyor:hover .conveyor-track{animation-play-state:paused}
.conv-item{flex:0 0 auto; width:190px; background:linear-gradient(160deg,#1a2c47,#12203A); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:16px; color:#fff; transition:.2s}
.conv-item:hover{border-color:var(--amber); transform:translateY(-4px)}
.conv-ic{width:46px; height:46px; border-radius:10px; background:linear-gradient(135deg,var(--blue),var(--steel-700)); display:flex; align-items:center; justify-content:center; margin-bottom:12px; font-size:24px}
.conv-item h4{font-size:16px; text-transform:uppercase; letter-spacing:.4px}
.conv-item small{color:var(--grey); font-size:12px}
@keyframes roll{from{transform:translateX(0)} to{transform:translateX(-50%)}}

/* ===== Section heading ===== */
.sec-head{max-width:760px; margin-bottom:44px}
.sec-head.center{margin-left:auto;margin-right:auto}
.sec-head h2{font-size:clamp(28px,3.6vw,44px); text-transform:uppercase; margin-top:8px}
.sec-head p{color:var(--muted); font-size:16.5px; margin-top:12px}

/* ===== Product / service cards ===== */
.filters{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:34px}
.chip{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:13px; padding:9px 18px; border:1.5px solid var(--line); border-radius:30px; background:#fff; cursor:pointer; color:var(--steel-800); transition:.15s}
.chip:hover{border-color:var(--blue)}
.chip.active{background:var(--steel-800); color:#fff; border-color:var(--steel-800)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:22px}
.card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:.2s; display:flex; flex-direction:column}
.card:hover{transform:translateY(-5px); box-shadow:var(--shadow); border-color:#c3d3e5}
.card .thumb{aspect-ratio:4/3; background:linear-gradient(150deg,#1a2c47,#12203A); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden}
.card .thumb img{width:100%; height:100%; object-fit:cover}
.card .thumb .ph{font-size:52px}
.card .thumb::after{content:""; position:absolute; left:0; bottom:0; width:100%; height:5px; background:var(--amber)}
.card .tag{position:absolute; top:12px; left:12px; background:rgba(12,20,32,.72); color:#fff; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:5px 10px; border-radius:6px; font-family:'Oswald',sans-serif}
.card .body{padding:18px; flex:1; display:flex; flex-direction:column}
.card h3{font-size:19px; text-transform:uppercase; margin-bottom:8px}
.card p{color:var(--muted); font-size:14px; margin:0 0 16px; flex:1}
.card .price{font-family:'Oswald',sans-serif; color:var(--steel-700); font-size:15px; margin-bottom:12px}
.card .card-cta{display:flex; gap:8px}
.card .card-cta .btn{flex:1; justify-content:center; padding:10px 12px; font-size:12px}

/* ===== Feature / why-us ===== */
.feat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:22px}
.feat{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px; transition:.2s}
.feat:hover{box-shadow:var(--shadow)}
.feat .fic{width:54px; height:54px; border-radius:12px; background:linear-gradient(135deg,var(--amber-glow),var(--amber)); display:flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:16px}
.feat h3{font-size:20px; text-transform:uppercase; margin-bottom:8px}
.feat p{color:var(--muted); font-size:14.5px; margin:0}

/* ===== CTA band ===== */
.cta-band{background:linear-gradient(120deg,var(--steel-800),var(--steel-700)); color:#fff; border-radius:20px; padding:46px; display:flex; align-items:center; justify-content:space-between; gap:26px; flex-wrap:wrap; position:relative; overflow:hidden}
.cta-band::before{content:""; position:absolute; right:-40px; top:-40px; width:220px; height:220px; border:30px solid rgba(245,129,30,.15); border-radius:50%}
.cta-band h2{font-size:32px; text-transform:uppercase; position:relative}
.cta-band p{color:#c7d3e2; margin:8px 0 0; position:relative}

/* ===== Forms ===== */
.form-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow)}
.field{margin-bottom:16px}
.field label{display:block; font-size:13px; font-weight:600; color:var(--steel-800); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:9px; font:inherit; color:var(--ink); background:#fff; transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(46,111,191,.15)}
.field textarea{min-height:110px; resize:vertical}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px}

/* ===== Footer ===== */
footer.site{background:var(--steel-900); color:#a9b7c9; padding:56px 0 24px}
footer.site .cols{display:grid; grid-template-columns:1.4fr 1fr 1fr 1.2fr; gap:34px}
footer.site h4{color:#fff; text-transform:uppercase; font-size:16px; letter-spacing:1px; margin-bottom:16px}
footer.site a{color:#a9b7c9} footer.site a:hover{color:var(--amber-glow)}
footer.site ul{list-style:none; padding:0; margin:0}
footer.site li{margin-bottom:9px; font-size:14.5px}
footer .flogo{height:56px; margin-bottom:14px; background:#fff; padding:8px 12px; border-radius:10px; display:inline-block}
footer .fcontact li{display:flex; gap:9px; align-items:flex-start}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1); margin-top:38px; padding-top:20px; text-align:center; font-size:13px; color:var(--grey)}

/* ===== Info list (contact/about) ===== */
.info-list{list-style:none; padding:0; margin:0}
.info-list li{display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); align-items:flex-start}
.info-list .ic{width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px}
.info-list b{display:block; font-size:15px; color:var(--steel-800)}
.info-list span{color:var(--muted); font-size:14.5px}

/* ===== WhatsApp float ===== */
.wa-float{position:fixed; right:23px; bottom:96px; z-index:60; width:52px; height:52px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(37,211,102,.5); font-size:26px; color:#fff}
.wa-float:hover{transform:scale(1.06)}

/* ===== Admin ===== */
.admin-shell{max-width:1080px; margin:34px auto; padding:0 20px}
.admin-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px; border-bottom:2px solid var(--line)}
.admin-tabs button{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:14px; background:none; border:0; padding:12px 18px; cursor:pointer; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-2px}
.admin-tabs button.active{color:var(--steel-800); border-color:var(--amber)}
.panel{display:none} .panel.active{display:block}
.doc{background:#fff; border:1px solid var(--line); border-radius:12px; padding:30px; box-shadow:var(--shadow)}
table.lines{width:100%; border-collapse:collapse; margin:14px 0}
table.lines th,table.lines td{border:1px solid var(--line); padding:9px 10px; font-size:14px; text-align:left}
table.lines th{background:var(--paper); font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.5px; font-size:12.5px}
table.lines input,table.lines select{width:100%; border:1px solid var(--line); border-radius:6px; padding:7px}
.totbox{max-width:340px; margin-left:auto; margin-top:16px}
.totbox .row{display:flex; justify-content:space-between; padding:7px 0; font-size:15px}
.totbox .row.grand{border-top:2px solid var(--steel-800); margin-top:6px; padding-top:12px; font-family:'Oswald',sans-serif; font-size:20px; font-weight:700}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0}
.tiny{font-size:12.5px; color:var(--muted)}
.notice{background:#fff7ee; border:1px solid #ffd8a8; color:#8a4b00; padding:12px 16px; border-radius:10px; font-size:13.5px; margin-bottom:18px}

/* Print doc header */
.doc-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--steel-700); padding-bottom:16px; margin-bottom:18px}
.doc-head .co h2{font-size:26px; color:var(--steel-800); text-transform:uppercase}
.doc-head .co small{color:var(--amber); font-weight:600; letter-spacing:1px; text-transform:uppercase; font-size:12px}
.doc-head .co p{margin:6px 0 0; font-size:13px; color:var(--muted); max-width:320px}
.doc-head .meta{text-align:right; font-size:13.5px}
.doc-head .meta .dt{font-family:'Oswald',sans-serif; font-size:22px; text-transform:uppercase; color:var(--steel-800)}

/* ===== Responsive ===== */
@media(max-width:900px){
  header.site .wrap{flex-wrap:wrap; row-gap:10px; padding-bottom:10px}
  .brand{order:1}
  .nav-cta{order:2; display:flex; gap:8px}
  .nav-cta .btn{padding:10px 14px; font-size:13px}
  nav.main{order:3; flex-basis:100%; overflow-x:auto; justify-content:flex-start; gap:8px; padding-bottom:2px; scrollbar-width:none}
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{white-space:nowrap; flex:0 0 auto; background:var(--paper); font-size:14px; padding:9px 16px}
  nav.main a.active{background:var(--steel-800); color:#fff}
  nav.main a.active::after{display:none}
  .burger{display:none}
  .hero-grid{grid-template-columns:1fr} .hero-visual{order:-1}
  .cta-band{padding:32px}
  footer.site .cols{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr}
}
@media(max-width:560px){
  .section{padding:52px 0}
  footer.site .cols{grid-template-columns:1fr}
  .hero-stats{gap:20px}
}
@media(prefers-reduced-motion:reduce){
  .conveyor-track{animation:none}
  *{scroll-behavior:auto}
}
/* ===== Share buttons ===== */
.share-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.share-btn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; border:0; cursor:pointer; color:#fff; text-decoration:none; transition:.15s}
.share-btn:hover{transform:translateY(-3px)}
.sh-wa{background:#25D366} .sh-fb{background:#1877F2} .sh-x{background:#111} .sh-cp{background:var(--blue)}
.card .sh{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; background:rgba(12,20,32,.72); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; border:0; z-index:2; transition:.15s}
.card .sh:hover{background:var(--amber); color:#241200}

/* ===== Zara assistant ===== */
.zara-toggle{position:fixed; right:20px; bottom:20px; z-index:70; width:66px; height:66px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--steel-700)); border:3px solid var(--amber); cursor:pointer; box-shadow:0 12px 28px rgba(12,20,32,.4); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; letter-spacing:.5px}
.zara-toggle:hover{transform:scale(1.05)}
.zara-toggle .pulse{position:absolute; top:0; right:2px; width:14px; height:14px; background:#25D366; border:2px solid #fff; border-radius:50%}
.zara-panel{position:fixed; right:20px; bottom:98px; z-index:71; width:370px; max-width:calc(100vw - 32px); height:540px; max-height:calc(100vh - 130px); background:#fff; border-radius:18px; box-shadow:0 24px 60px rgba(12,20,32,.45); display:none; flex-direction:column; overflow:hidden; border:1px solid var(--line)}
.zara-panel.open{display:flex}
.zara-head{background:linear-gradient(135deg,var(--steel-800),var(--steel-700)); color:#fff; padding:15px 16px; display:flex; align-items:center; gap:12px}
.zara-head .av{width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--amber-glow),var(--amber)); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; color:#241200; font-size:22px}
.zara-head h4{font-size:19px; text-transform:uppercase; margin:0; line-height:1}
.zara-head small{color:#bcd0e6; font-size:12px}
.zara-head .cls{margin-left:auto; background:none; border:0; color:#fff; font-size:26px; cursor:pointer; line-height:1}
.zara-head .zara-spk{background:none; border:0; color:#fff; cursor:pointer; padding:4px; display:flex; align-items:center; opacity:.9}
.zara-head .zara-spk:hover{opacity:1}
.zara-foot .mic{background:#eef3f8; border:1.5px solid var(--line); width:44px; height:44px; border-radius:50%; cursor:pointer; flex:0 0 44px; display:flex; align-items:center; justify-content:center}
.zara-foot .mic.rec{background:#ffe0e0; border-color:#e57373; animation:micpulse 1s infinite}
@keyframes micpulse{0%,100%{opacity:1}50%{opacity:.45}}
.wa-float svg{width:30px; height:30px}
.share-btn svg{display:block}
.zara-body{flex:1; overflow-y:auto; padding:16px; background:var(--paper); display:flex; flex-direction:column; gap:10px}
.zmsg{max-width:82%; padding:10px 14px; border-radius:15px; font-size:14px; line-height:1.55}
.zmsg.bot{background:#fff; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px}
.zmsg.user{background:var(--steel-700); color:#fff; align-self:flex-end; border-bottom-right-radius:4px}
.zmsg a{color:var(--blue); font-weight:600} .zmsg.user a{color:#fff}
.zchips{display:flex; gap:8px; flex-wrap:wrap; align-self:flex-start; margin-top:-2px}
.zchip{background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:7px 13px; font-size:12.5px; cursor:pointer; color:var(--steel-800)}
.zchip:hover{border-color:var(--amber); color:var(--amber)}
.zara-foot{display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:#fff}
.zara-foot input{flex:1; border:1.5px solid var(--line); border-radius:22px; padding:10px 15px; font:inherit}
.zara-foot input:focus{outline:none; border-color:var(--blue)}
.zara-foot button{background:var(--amber); border:0; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:17px; color:#241200; flex:0 0 44px}
@media(max-width:480px){.zara-panel{height:66vh; right:12px; left:12px; width:auto} .zara-toggle{width:58px;height:58px;font-size:14px}}

/* ===== Gallery ===== */
.gallery{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.gitem{margin:0; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:zoom-in; transition:.2s}
.gitem:hover{box-shadow:var(--shadow); transform:translateY(-3px)}
.gitem img{width:100%; display:block}
.gitem figcaption{padding:13px 15px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.6px; font-size:14px; color:var(--steel-800); border-top:1px solid var(--line)}
.lightbox{position:fixed; inset:0; background:rgba(8,14,24,.93); z-index:200; display:none; align-items:center; justify-content:center; padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:96%; max-height:92%; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox .lb-close{position:absolute; top:16px; right:24px; color:#fff; font-size:40px; cursor:pointer; line-height:1}
@media(max-width:700px){.gallery{grid-template-columns:1fr}}

@media print{
  .topbar,header.site,footer.site,.wa-float,.zara-toggle,.zara-panel,.admin-tabs,.toolbar,.notice,.no-print{display:none!important}
  .doc{box-shadow:none;border:0}
  body{background:#fff}
}

</style>

/* ---------- Read products live from Google Sheet ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,"");            // strip BOM
  const rows=[]; let f="",row=[],q=false,i=0;
  while(i<text.length){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c=='"')q=true; else if(c==','){row.push(f);f="";}
           else if(c=='\n'){row.push(f);rows.push(row);row=[];f="";}
           else if(c!='\r')f+=c; }
    i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
async function loadRemote(){
  if(!PF_CSV) return;
  try{
    const res = await fetch(PF_CSV + "&t=" + Date.now());
    const rows = parseCSV(await res.text()).filter(r=>r.length>1);
    if(!rows.length) return;
    const head = rows[0].map(h=>h.trim().toLowerCase());
    const idx = n=>head.indexOf(n);
    const out=[];
    for(let r=1;r<rows.length;r++){
      const row=rows[r];
      const g = n=>{const k=idx(n); return k>=0 ? (row[k]||"").trim() : "";};
      if(!g("name")) continue;
      if(g("active").toLowerCase()==="no") continue;
      out.push({ id:g("id")||"sheet-"+r, name:g("name"), category:g("category")||"Spare Parts",
        icon:g("icon")||"⚙️", price:g("price"), image:g("image"), desc:g("desc") });
    }
    REMOTE = out;
    window.dispatchEvent(new Event("pf:products"));
  }catch(e){ /* offline / not published yet — seed catalogue still shows */ }
}

async function pfPost(payload){
  try{
    const res = await fetch(PF_API,{ method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload) });
    try{ return await res.json(); }catch(_){ return {ok:true, unread:true}; }
  }catch(e){ return {ok:true, unread:true}; }   // couldn't read response; assume sent
}

        <li>📍 <span>${CO.addr}</span></li>
        <li>📞 <span><a href="tel:${CO.mob1.replace(/\s/g,'')}">${CO.mob1}</a>, <a href="tel:${CO.mob2.replace(/\s/g,'')}">${CO.mob2}</a></span></li>
        <li>☎️ <span>${CO.phone}</span></li>
        <li>✉️ <span><a href="mailto:${CO.email}">${CO.email}</a></span></li>
      </ul></div>
    </div>
    <div class="footer-bottom">© ${new Date().getFullYear()} ${CO.name} — ${CO.tagline}. All rights reserved.</div>
  </div></footer>
  <a class="wa-float" href="https://wa.me/${CO.wa}?text=Hello%20Priya%20Fabrication,%20I%20need%20a%20quotation." target="_blank" aria-label="WhatsApp">${ICON.wa}</a>`;

  const h = document.getElementById("chrome-header");
  const f = document.getElementById("chrome-footer");
  if(h) h.innerHTML = header;
  if(f) f.innerHTML = footer;

  initShare();
  initLightbox();
  buildZara();
  loadRemote();
}

/* ---------- Lightbox (gallery zoom) ---------- */
function initLightbox(){
  const imgs = document.querySelectorAll(".gitem img");
  if(!imgs.length) return;
  let lb = document.getElementById("pfLightbox");
  if(!lb){
    lb = document.createElement("div");
    lb.id = "pfLightbox"; lb.className = "lightbox";
    lb.innerHTML = `<span class="lb-close">&times;</span><img alt="">`;
    document.body.appendChild(lb);
    lb.addEventListener("click", ()=>lb.classList.remove("open"));
  }
  const big = lb.querySelector("img");
  imgs.forEach(im=>im.addEventListener("click", ()=>{ big.src = im.src; lb.classList.add("open"); }));
}

/* ---------- Share ---------- */
function initShare(){
  const url = encodeURIComponent(location.href);
  const t = encodeURIComponent(CO.name+" — "+CO.tagline);
  const map = {
    wa:`https://wa.me/?text=${t}%20${url}`,
    fb:`https://www.facebook.com/sharer/sharer.php?u=${url}`,
    x:`https://twitter.com/intent/tweet?text=${t}&url=${url}`
  };
  document.querySelectorAll('#footShare [data-sh]').forEach(el=>{
    const k = el.dataset.sh;
    if(map[k]){ el.href = map[k]; el.target = "_blank"; el.rel="noopener"; }
    if(k==="cp") el.onclick = ()=>{
      const done=()=>{ el.textContent="✔"; setTimeout(()=>el.textContent="🔗",1500); };
      if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(done,done); else done();
    };
  });
}
function shareProduct(name){
  const url = location.origin + location.pathname.replace(/[^/]*$/,'') + "products.html";
  const text = name + " — " + CO.name;
  if(navigator.share){ navigator.share({title:text, text:text, url}).catch(()=>{}); }
  else window.open(`https://wa.me/?text=${encodeURIComponent(text+" "+url)}`,"_blank");
}

/* ---------- Card renderer ---------- */
function productCard(p){
  const img = p.image
    ? `<img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.parentNode.querySelector('.ph').style.display='flex'">`
    : "";
  const price = p.price ? `<div class="price">₹ ${p.price}</div>` : "";
  const wa = `https://wa.me/${CO.wa}?text=${encodeURIComponent("Hello Priya Fabrication, I want a quote for: "+p.name)}`;
  return `<article class="card">
    <div class="thumb">
      ${img}
      <span class="ph" style="${p.image?'display:none':''}">${p.icon||'⚙️'}</span>
      <span class="tag">${p.category}</span>
      <button class="sh" title="Share" onclick="shareProduct('${p.name.replace(/'/g,"\\'")}')">${ICON.share}</button>
    </div>
    <div class="body">
      <h3>${p.name}</h3>
      <p>${p.desc||''}</p>
      ${price}
      <div class="card-cta">
        <a class="btn btn-amber" href="${wa}" target="_blank">Enquire</a>
        <a class="btn btn-outline" href="contact.html">Quote</a>
      </div>
    </div>
  </article>`;
}

/* ================= Zara — website assistant (voice + full product knowledge) ================= */
let zaraVoiceOn = true;
function buildZara(){
  if(document.getElementById("zaraToggle")) return;
  const box = document.createElement("div");
  box.innerHTML = `
    <button class="zara-toggle" id="zaraToggle" aria-label="Chat with Zara">${ICON.robot}<span class="pulse"></span></button>
    <div class="zara-panel" id="zaraPanel" role="dialog" aria-label="Zara assistant">
      <div class="zara-head">
        <div class="av">Z</div>
        <div style="flex:1"><h4>Zara</h4><small>Priya Fabrication assistant</small></div>
        <button class="zara-spk" id="zaraSpk" title="Voice on/off">${ICON.spkOn}</button>
        <button class="cls" id="zaraClose" aria-label="Close">&times;</button>
      </div>
      <div class="zara-body" id="zaraBody"></div>
      <div class="zara-foot">
        <button class="mic" id="zaraMic" title="Bol kar poochho" style="display:none">${ICON.mic}</button>
        <input id="zaraInput" placeholder="Type ya 🎤 bol kar poochho…" autocomplete="off">
        <button id="zaraSend" aria-label="Send">${ICON.send}</button>
      </div>
    </div>`;
  document.body.appendChild(box);

  const panel=document.getElementById("zaraPanel"),
        body=document.getElementById("zaraBody"),
        input=document.getElementById("zaraInput");

  loadRemote(); // make sure sheet products are known to Zara

  document.getElementById("zaraToggle").onclick=()=>{
    panel.classList.toggle("open");
    if(panel.classList.contains("open") && !body.dataset.init){ zGreet(); body.dataset.init="1"; input.focus(); }
  };
  document.getElementById("zaraClose").onclick=()=>{ panel.classList.remove("open"); stopSpeak(); };

  // ---- Voice out (TTS) ----
  const spkBtn=document.getElementById("zaraSpk");
  spkBtn.onclick=()=>{ zaraVoiceOn=!zaraVoiceOn; spkBtn.innerHTML=zaraVoiceOn?ICON.spkOn:ICON.spkOff; if(!zaraVoiceOn) stopSpeak(); };
  function stopSpeak(){ try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} }
  function zSpeak(html){
    if(!zaraVoiceOn || !("speechSynthesis" in window)) return;
    const tmp=document.createElement("div"); tmp.innerHTML=html;
    const text=(tmp.textContent||"").replace(/https?:\/\/\S+/g,"").trim();
    if(!text) return;
    const u=new SpeechSynthesisUtterance(text);
    const voices=speechSynthesis.getVoices();
    const hi=voices.find(v=>/hi(-|_)IN/i.test(v.lang)) || voices.find(v=>/en(-|_)IN/i.test(v.lang));
    if(hi) u.voice=hi;
    u.lang=hi?hi.lang:"hi-IN"; u.rate=1; u.pitch=1;
    speechSynthesis.speak(u);
  }

  // ---- Voice in (STT) ----
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mic=document.getElementById("zaraMic");
  if(SR){
    mic.style.display="flex";
    const rec=new SR(); rec.lang="hi-IN"; rec.interimResults=false; rec.maxAlternatives=1;
    mic.onclick=()=>{ try{ stopSpeak(); mic.classList.add("rec"); rec.start(); }catch(e){} };
    rec.onresult=e=>{ const t=e.results[0][0].transcript; input.value=t; zHandleInput(); };
    rec.onend=()=>mic.classList.remove("rec");
    rec.onerror=()=>mic.classList.remove("rec");
  }

  document.getElementById("zaraSend").onclick=zHandleInput;
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") zHandleInput(); });

  function zScroll(){ body.scrollTop=body.scrollHeight; }
  function zBot(html){ const d=document.createElement("div"); d.className="zmsg bot"; d.innerHTML=html; body.appendChild(d); zScroll(); zSpeak(html); }
  function zUser(txt){ const d=document.createElement("div"); d.className="zmsg user"; d.textContent=txt; body.appendChild(d); zScroll(); }
  function zChips(arr){
    const w=document.createElement("div"); w.className="zchips";
    arr.forEach(c=>{ const b=document.createElement("button"); b.className="zchip"; b.textContent=c; b.onclick=()=>zRoute(c); w.appendChild(b); });
    body.appendChild(w); zScroll();
  }
  window.zGreet=function(){
    const n=getProducts().length;
    zBot(`Namaste! 👋 Main <b>Zara</b> hoon — Priya Fabrication ki assistant. Mujhe hamare <b>${n}+ products</b> ki jaankari hai. Kisi bhi product ka naam poochho (boiler, chimney, scrubber, valve…), ya quote/contact ke liye bata do 🙂`);
    zChips(["Saare products","Quote chahiye","Contact","WhatsApp par baat"]);
  };
  function zHandleInput(){ const v=input.value.trim(); if(!v) return; input.value=""; zRoute(v); }

  const WA=`https://wa.me/${CO.wa}`;
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9\u0900-\u097F ]/g," ");

  function zRoute(q){
    zUser(q);
    stopSpeak();
    const s=norm(q);

    // WhatsApp
    if(/whats ?app|व्हाट्स/.test(s)){
      zBot(`Zaroor! Yahan tap karke seedha message bhejo 👇`);
      zBot(`<a href="${WA}?text=${encodeURIComponent('Hello Priya Fabrication, mujhe enquiry karni hai.')}" target="_blank">🟢 WhatsApp par chat kholo</a>`);
      return;
    }
    // Contact
    if(/contact|address|number|phone|mobile|email|kah[aā]n|location|pat[aā]|कॉन्टैक्ट|पता/.test(s)){
      zBot(`<b>Priya Fabrication</b><br>📍 ${CO.addr}<br>📞 <a href="tel:${CO.mob1.replace(/\s/g,'')}">${CO.mob1}</a>, <a href="tel:${CO.mob2.replace(/\s/g,'')}">${CO.mob2}</a><br>☎️ ${CO.phone}<br>✉️ <a href="mailto:${CO.email}">${CO.email}</a>`);
      zChips(["Saare products","Quote chahiye"]);
      return;
    }
    // Quote / price
    if(/quot|price|rate|cost|kitne|kitn[aā]|d[aā]m|कीमत|रेट|भाव/.test(s)){
      zBot(`Har product aapki requirement (capacity, size, material) ke hisaab se custom banta hai — best rate quotation par milta hai:`);
      zBot(`1️⃣ <a href="contact.html">Get a Quote form bharo</a><br>2️⃣ <a href="${WA}?text=${encodeURIComponent('Hello, mujhe quotation chahiye for: ')}" target="_blank">WhatsApp par requirement bhejo</a>`);
      return;
    }
    // Greetings / thanks
    if(/^(hi|hello|hey|namaste|hii+|helo|namaskar)\b|नमस्ते|हेलो/.test(s)){ zGreet(); return; }
    if(/thank|shukr|dhanyav|धन्यवाद|शुक्रिया/.test(s)){ zBot("Aapka swagat hai! 🙏 Aur kuch poochna ho to yahin hoon."); return; }

    const prods=getProducts();

    // List all / categories
    if(/saare|sar[eā]|all|list|kya kya|kitne product|categor|श्रेणी|सारे|लिस्ट/.test(s)){
      const byCat=CATS.map(c=>{const items=prods.filter(p=>p.category===c); return items.length?`<b>${c}</b> (${items.length})`:null;}).filter(Boolean);
      zBot(`Hamare paas <b>${prods.length} products</b> hain, in categories me:<br>• ${byCat.join("<br>• ")}`);
      zBot(`Poori list <a href="products.html">Products page</a> par dekho, ya kisi category/product ka naam likho.`);
      zChips(CATS.slice(0,4));
      return;
    }

    // Category match
    const catHit=CATS.find(c=>norm(c).split(" ").some(w=>w.length>3 && s.includes(w)));
    if(catHit){
      const items=prods.filter(p=>p.category===catHit);
      zBot(`<b>${catHit}</b> me ${items.length} products:`);
      zBot(items.slice(0,8).map(p=>`${p.icon||'⚙️'} <b>${p.name}</b>`).join("<br>"));
      zChips(["Quote chahiye","Contact"]);
      return;
    }

    // Product search (name/desc/category), tolerant
    const toks=s.split(" ").filter(w=>w.length>2);
    let hits=prods.filter(p=>{ const hay=norm(p.name+" "+p.category+" "+(p.desc||"")); return toks.some(t=>hay.includes(t)); });
    if(!hits.length && toks.length){ hits=prods.filter(p=>toks.some(t=>norm(p.name).includes(t.slice(0,4)))); }

    if(hits.length===1){
      const p=hits[0];
      zBot(`${p.icon||'⚙️'} <b>${p.name}</b><br>${p.desc||''}<br><i>Category:</i> ${p.category}${p.price?`<br><i>Price:</i> ₹${p.price}`:''}`);
      zBot(`<a href="${WA}?text=${encodeURIComponent('Hello, mujhe chahiye: '+p.name)}" target="_blank">🟢 Iski enquiry bhejo</a>`);
      zChips(["Quote chahiye","Contact","Saare products"]);
      return;
    }
    if(hits.length){
      zBot(`Ye ${hits.length} products mile 👇`);
      zBot(hits.slice(0,7).map(p=>`${p.icon||'⚙️'} <b>${p.name}</b> <a href="${WA}?text=${encodeURIComponent('Hello, mujhe chahiye: '+p.name)}" target="_blank">— enquire</a>`).join("<br>"));
      zChips(["Quote chahiye","Contact"]);
      return;
    }

    // Fallback
    zBot(`Ye samajh nahi aaya 🙈 Product ka naam likho (jaise "boiler", "scrubber", "valve"), ya niche se choose karo:`);
    zChips(["Saare products","Quote chahiye","Contact","WhatsApp par baat"]);
  }
  window.zRoute=zRoute;

  // voices load lazily in some browsers
  if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=()=>{}; }
}

</script>
<script>
buildChrome("products.html");
const params = new URLSearchParams(location.search);
let activeCat = params.get("cat") || "All";
if(![...CATS,"All"].includes(activeCat)) activeCat="All";

const cats = ["All",...CATS];
document.getElementById("filters").innerHTML = cats.map(c=>`<button class="chip ${c===activeCat?'active':''}" data-c="${c}">${c}</button>`).join("");

function render(){
  const products = getProducts();
  const list = activeCat==="All" ? products : products.filter(p=>p.category===activeCat);
  document.getElementById("grid").innerHTML = list.map(productCard).join("") || `<p class="center">No products in this category yet.</p>`;
  document.getElementById("count").textContent = `Showing ${list.length} item(s)`;
}
document.querySelectorAll("#filters .chip").forEach(ch=>ch.onclick=()=>{
  activeCat=ch.dataset.c;
  document.querySelectorAll("#filters .chip").forEach(x=>x.classList.remove("active"));
  ch.classList.add("active"); render();
  history.replaceState(null,"",activeCat==="All"?"products.html":"products.html?cat="+encodeURIComponent(activeCat));
});
render();
window.addEventListener("pf:products", render);
</script>
